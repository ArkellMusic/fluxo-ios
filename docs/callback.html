<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo · Volviendo a la app</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#06110e; color:#e8fff6;
         font-family:-apple-system, system-ui, sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
  a { display:inline-block; margin-top:18px; padding:14px 26px; border-radius:999px; background:#46d9a6;
      color:#04221a; font-weight:700; text-decoration:none; }
  p { opacity:.75 }
</style>
</head>
<body>
  <div>
    <h2>Banco conectado</h2>
    <p>Volviendo a Fluxo…</p>
    <a id="open" href="#">Abrir Fluxo</a>
  </div>
<script>
  var target = "fluxo://callback" + window.location.search;
  document.getElementById("open").href = target;
  window.location.replace(target);
</script>
</body>
</html>
